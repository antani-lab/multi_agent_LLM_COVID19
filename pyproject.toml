[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-cxr"
version = "0.1.0"
description = "Leakage-audited evaluation of autonomous agents for chest-radiograph interpretation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Zhaohui Liang"},
  {name = "Sivaramakrishnan Rajaraman"},
  {name = "Niccolo Marini"},
  {name = "Zhiyun Xue"},
  {name = "Sameer Antani", email = "sameer.antani@nih.gov"},
]
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
notebooks = [
  "accelerate>=1.2",
  "datasets>=2.18",
  "huggingface-hub>=0.28",
  "ipykernel>=6.29",
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
  "open-clip-torch>=2.24",
  "openpyxl>=3.1",
  "peft>=0.14",
  "Pillow>=10",
  "protobuf>=4",
  "psutil>=5.9",
  "pyarrow>=15",
  "safetensors>=0.4.3",
  "seaborn>=0.13",
  "sentencepiece>=0.2",
  "timm>=1.0",
  "torch>=2.4",
  "torchxrayvision>=1.2",
  "torchvision>=0.19",
  "tqdm>=4.66",
  "transformers>=4.50,<5",
]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
