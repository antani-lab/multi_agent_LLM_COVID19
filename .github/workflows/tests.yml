name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Run unit tests
        run: python -m pytest
      - name: Validate notebooks and repository structure
        run: python scripts/validate_repository.py
      - name: Check shared-module synchronization
        run: python scripts/sync_shared_modules.py --check
